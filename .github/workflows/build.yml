name: Build FFmpeg

# A run on a release tag such as 8.1.3-1, whether the tag was pushed or the workflow was dispatched on it,
# builds, proves and publishes one release under that tag. A manual run on a branch keeps its builds as artifacts.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to build and verify'
        type: choice
        default: all
        options:
          - all
          - macos
          - macos-intel

permissions:
  contents: write
  packages: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  pre_check:
    name: Pre Checks
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.targets.outputs.macos }}
    steps:
      - name: Choose macOS targets
        id: targets
        run: |
          case "$TARGETS" in
            macos-intel) echo 'macos=[{"target":"macos64","runner":"macos-15-intel"}]' ;;
            *) echo 'macos=[{"target":"macos64","runner":"macos-15-intel"},{"target":"macosarm64","runner":"macos-latest"}]' ;;
          esac >> "$GITHUB_OUTPUT"
        env:
          TARGETS: ${{ inputs.targets }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Tag matches the pin and has no release yet
        if: ${{ github.ref_type == 'tag' }}
        run: |
          source magpie/vars.sh
          if [[ "$GITHUB_REF_NAME" != "$MAGPIE_RELEASE_TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match magpie-ffmpeg.json, which publishes as $MAGPIE_RELEASE_TAG."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME exists. Releases are never overwritten: raise revision in magpie-ffmpeg.json and push its new tag."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  build_base:
    name: Build base image
    if: ${{ github.ref_type == 'tag' || inputs.targets == 'all' }}
    needs: pre_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
          tar czf .cache/cache.tar.gz .cache/downloads/*
      - name: Upload cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: download-cache
          overwrite: true
          path: .cache/cache.tar.gz
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: org
          untagged_only: true
  build_target_bases:
    name: Build target base image
    needs: build_base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base-${{ matrix.target }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: org
          untagged_only: true
  build_targets:
    name: Build target-variant image
    needs: build_target_bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
        variant: [gpl 8.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${{ matrix.target }}-${{ matrix.variant }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: org
          untagged_only: true
  build_ffmpeg:
    name: Build ffmpeg
    needs: build_targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
        variant: [gpl 8.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Replace spaces in string
        id: strs
        run: |
          SLUG="${{ matrix.target }}-${{ matrix.variant }}"
          echo "artifact_slug=${SLUG// /-}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.strs.outputs.artifact_slug }}
          overwrite: true
          path: artifacts/*
  verify:
    name: Verify ffmpeg
    needs: build_ffmpeg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-latest
          - target: linuxarm64
            runner: ubuntu-24.04-arm
          - target: win64
            runner: windows-latest
          - target: winarm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.target }}-gpl-8.1
          path: artifacts
      - name: Verify on its own platform
        shell: bash
        run: bash magpie/verify-build.sh artifacts/ffmpeg-*
  build_macos:
    name: Build ffmpeg (macOS)
    needs: pre_check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pre_check.outputs.macos) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build ffmpeg
        run: bash magpie/macos-build.sh
      - name: Verify on its own platform
        run: bash magpie/verify-build.sh artifacts/ffmpeg-*.tar.xz
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          overwrite: true
          path: artifacts/ffmpeg-*.tar.xz
      - name: Upload dependency sources
        uses: actions/upload-artifact@v7
        with:
          name: macos-deps-src-${{ matrix.target }}
          overwrite: true
          path: artifacts/${{ matrix.target }}-deps-src
  publish_release:
    name: Publish release
    if: ${{ github.ref_type == 'tag' }}
    needs: [verify, build_macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts
      - name: Download macOS dependency sources
        uses: actions/download-artifact@v8
        with:
          pattern: macos-deps-src-*
          merge-multiple: true
          path: macos-deps-src
      - name: Download dependency source cache
        uses: actions/download-artifact@v8
        with:
          name: download-cache
          path: download-cache
      - name: Assemble release
        run: |
          set -euo pipefail
          source magpie/vars.sh
          TAG="$GITHUB_REF_NAME"
          TARBALL="${MAGPIE_TARBALL_URL##*/}"
          mkdir release
          mv artifacts/ffmpeg-*.zip artifacts/ffmpeg-*.tar.xz release/

          curl -fsSL --retry 3 -o "release/$TARBALL" "$MAGPIE_TARBALL_URL"
          echo "$MAGPIE_TARBALL_SHA256  release/$TARBALL" | sha256sum -c -

          # The dependency sources the Docker builds mounted: one list per target
          # (build.sh leaves <target>-gpl-8.1.txt beside each archive), taken from the
          # generated Dockerfiles, so a disabled script's source is never published.
          tar -xzf download-cache/cache.tar.gz
          rm -rf download-cache
          for built in artifacts/*-gpl-8.1.txt; do
            ./generate.sh "$(basename "$built" -gpl-8.1.txt)" gpl 8.1
            grep -o '\.cache/downloads/[^ ,]*\.tar\.xz' Dockerfile
          done | sort -u > deps-src.txt
          # Release assets must each be under 2 GiB.
          tar -cf - -T deps-src.txt | split -b 1900M -d -a 1 - "release/magpie-ffmpeg-$TAG-deps-src.tar.part"
          tar -cf - -C macos-deps-src . | split -b 1900M -d -a 1 - "release/magpie-ffmpeg-$TAG-macos-deps-src.tar.part"

          (cd release && sha256sum -- * > checksums.sha256)

          ./util/release_body.sh "$TAG" release/ffmpeg-"$MAGPIE_FFMPEG_TAG"-* > release_body.md
          cat >> release_body.md <<EOF

          FFmpeg $MAGPIE_VERSION: tag $MAGPIE_FFMPEG_TAG, commit $MAGPIE_FFMPEG_COMMIT, built by Ayers Electronics for Magpie from the recipe in this repository.
          It has no DVD or Blu-ray reading: libdvdcss, libdvdread, libdvdnav and libbluray are not built, and every build is configured with --disable-libdvdread --disable-libdvdnav --disable-libbluray.
          rav1e is not built either (--disable-librav1e): its build fetches Rust crates that could not be published here as source.
          The binaries are licensed under the GNU GPL version 3; each archive carries it as LICENSE.txt, and VERSION.txt holds $MAGPIE_VERSION.

          Corresponding source, published with this release:
          - $TARBALL: the FFmpeg release tarball, sha256 $MAGPIE_TARBALL_SHA256.
          - magpie-ffmpeg-$TAG-deps-src.tar.part*: the dependency sources the Windows and Linux builds mounted, exactly as the recipe downloaded them before building. Join the parts with cat, then untar.
          - magpie-ffmpeg-$TAG-macos-deps-src.tar.part*: every source archive the macOS builds downloaded, their build script at its pinned commit and Magpie's patch to it.
          - The build recipe: this repository at tag $TAG, the Source code archives below.
          EOF
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Magpie FFmpeg $GITHUB_REF_NAME" --notes-file release_body.md release/*
        env:
          GH_TOKEN: ${{ github.token }}
